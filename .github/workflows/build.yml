name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        run: dotnet build HunterBuddy.csproj --configuration Release --nologo

      - name: Package
        run: |
          $outDir = "bin\Release"
          Compress-Archive -Path "$outDir\*" -DestinationPath "HunterBuddy.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HunterBuddy
          path: HunterBuddy.zip

      # Les étapes suivantes s'exécutent uniquement sur un tag (ex: v1.2.3)
      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/')
        id: version
        run: echo "VERSION=$($env:GITHUB_REF_NAME -replace '^v','')" >> $env:GITHUB_OUTPUT

      - name: Update repo.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $json = Get-Content "repo.json" | ConvertFrom-Json
          $json[0].AssemblyVersion = "$version.0"
          $json[0].TestingAssemblyVersion = "$version.0"
          $json | ConvertTo-Json -Depth 10 | Set-Content "repo.json"
          Write-Host "repo.json mis à jour : $version"

      - name: Commit repo.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "chore: bump repo.json to ${{ steps.version.outputs.VERSION }}"
          git push origin HEAD:main

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HunterBuddy.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
